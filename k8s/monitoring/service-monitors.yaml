apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: service-b-monitor
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: service-b
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
---
