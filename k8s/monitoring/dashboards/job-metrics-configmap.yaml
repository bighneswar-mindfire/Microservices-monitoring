apiVersion: v1
kind: ConfigMap
metadata:
  name: job-metrics-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  job-metrics-dashboard.json: |
    {
      "title": "Job Processing Metrics",
      "uid": "job-processing-metrics",
      "schemaVersion": 39,
      "editable": true,
      "time": { "from": "now-30m", "to": "now" },
      "refresh": "10s",
      "panels": [
        {
          "title": "Queue Length",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 8, "h": 8 },
          "targets": [{ "expr": "queue_length", "legendFormat": "queue_length" }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "title": "Job Counts",
          "type": "timeseries",
          "gridPos": { "x": 8, "y": 0, "w": 8, "h": 8 },
          "targets": [
            { "expr": "total_jobs_submitted", "legendFormat": "submitted" },
            { "expr": "total_jobs_completed", "legendFormat": "completed" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "title": "CPU (Service B pods)",
          "type": "timeseries",
          "gridPos": { "x": 16, "y": 0, "w": 8, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"default\", pod=~\"service-b-.*\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" } }
        }
      ]
    }
